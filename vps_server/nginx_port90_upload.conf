# Cấu hình Nginx Port 90 hoàn chỉnh hỗ trợ tải APK, version.json và Upload/View Ảnh
server {
    listen 90;
    listen [::]:90;

    server_name nthiennhan.ddns.net;

    root /var/www/html;
    index index.html index.php index.htm;

    # Kích thước tối đa của file upload (50MB cho ảnh / APK)
    client_max_body_size 50M;

    # 1. Thư mục APK & Version
    location /app/ {
        alias /var/www/html/app/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Cache-Control "no-cache, must-revalidate";

        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
    }

    # 2. Thư mục lưu trữ hình ảnh tải lên (/uploads/receipts/, /uploads/avatars/)
    location /uploads/ {
        alias /var/www/html/uploads/;
        autoindex off;
        
        # Cho phép app Flutter truy cập ảnh
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers '*';
        
        # Cache ảnh cho nhanh
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. API Upload Handler (PHP)
    location /api/ {
        alias /var/www/html/api/;
        try_files $uri $uri/ /api/upload.php?$args;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            # Hoặc php8.1-fpm / php8.2-fpm / php7.4-fpm tuỳ phiên bản cài đặt
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # PHP handler chung
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    access_log /var/log/nginx/app-access.log;
    error_log /var/log/nginx/app-error.log;
}
